; php-fpm pool for the bench. Run from fpm/ (the Makefile does):
;   php-fpm -F -p $PWD -y php-fpm.conf
; No custom php.ini: inherits the system /etc/php/php.ini (opcache.enable=1),
; the same config every other server in the suite loads.

[global]
error_log = /proc/self/fd/2
daemonize = no

[bench]
; Stock fpm listen address; nginx's fastcgi_pass points here. One fastcgi conn
; per request (no keep_conn) — the classic deployment's per-request cost,
; deliberately not tuned away. A unix socket would gain a few %.
listen = 127.0.0.1:9000
; Default 511 drops connects when nginx fans out thousands of fastcgi conns
; under wrk -c5000 (kernel still clamps to net.core.somaxconn).
listen.backlog = 65535
; Worker parity: 32 resident PHP processes, like every other server here.
pm = static
pm.max_children = 32
catch_workers_output = yes
