# nginx front for php-fpm — the classic nginx+FPM stack. Run from fpm/ (the
# Makefile does):  nginx -p $PWD -e stderr -c nginx.conf -g 'daemon off;'
# Unprivileged: pid + temp paths live under fpm/run + fpm/tmp (the compiled-in
# defaults sit under /var); logs go to stderr.
# Front controller: EVERY method/path executes hello.php over fastcgi — no
# try_files, no static files (parity: on the other servers any path reaches the
# worker too). nginx.scenario.conf is this file with scenario.php instead.

worker_processes auto;          # classic deployment default: one worker per core
worker_rlimit_nofile 65536;     # wrk -c5000 exceeds the default 1024-fd limit
pid run/nginx.pid;

events {
    worker_connections 16384;
}

http {
    access_log off;             # parity: no server in the suite access-logs

    # User-writable temp paths (all unused by this workload, but nginx creates
    # them at startup and the compiled-in defaults are not writable).
    client_body_temp_path tmp/client_body;
    fastcgi_temp_path tmp/fastcgi;
    proxy_temp_path tmp/proxy;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    # Default 1000 recycles client conns mid-bench: server-side closes and the
    # TIME-WAIT churn the keepalive guard flags (see INSTRUCTIONS.md).
    keepalive_requests 1000000;

    server {
        listen 8080 backlog=65535;   # default 511 drops SYNs under wrk -c5000
        server_name _;
        root .;                      # resolved against the -p prefix (fpm/)

        location / {
            fastcgi_pass 127.0.0.1:9000;
            # Standard fastcgi_params inlined (an `include` would resolve
            # against this prefix, not /etc/nginx), SCRIPT_* pinned to the
            # front-controller script.
            fastcgi_param SCRIPT_FILENAME  $document_root/hello.php;
            fastcgi_param SCRIPT_NAME      /hello.php;
            fastcgi_param QUERY_STRING     $query_string;
            fastcgi_param REQUEST_METHOD   $request_method;
            fastcgi_param CONTENT_TYPE     $content_type;
            fastcgi_param CONTENT_LENGTH   $content_length;
            fastcgi_param REQUEST_URI      $request_uri;
            fastcgi_param DOCUMENT_URI     $document_uri;
            fastcgi_param DOCUMENT_ROOT    $document_root;
            fastcgi_param SERVER_PROTOCOL  $server_protocol;
            fastcgi_param REQUEST_SCHEME   $scheme;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE  nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR      $remote_addr;
            fastcgi_param REMOTE_PORT      $remote_port;
            fastcgi_param SERVER_ADDR      $server_addr;
            fastcgi_param SERVER_PORT      $server_port;
            fastcgi_param SERVER_NAME      $server_name;
        }
    }
}
