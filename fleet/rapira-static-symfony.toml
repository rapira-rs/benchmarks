# A fragment of the [http] table for the symfony static legs. leg.sh pastes it
# into the rendered rapira.toml. @@RIG@@ is the staged rig directory
# ($HOME/bench-rig). A miss falls through to the symfony worker.
# root is the on-box docroot of the app provisioning builds with composer.
middleware = ["static"]

[http.static]
root = "/opt/bench/fleet/apps/symfony/public"
