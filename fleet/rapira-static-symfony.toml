# Static middleware for the symfony static legs. Mode, processes, listen, and
# the entrypoint come from the CLI flags, which override this file. A miss
# falls through to the symfony worker.
# root is the on-box docroot of the app provisioning builds with composer; a
# relative path would resolve against this file's directory in the staged rig.
[http]
middleware = ["static"]

[http.static]
root = "/opt/bench/fleet/apps/symfony/public"
