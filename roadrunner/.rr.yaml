# RoadRunner config — matched to the rapira/FrankenPHP/Folk benchmark
# (32 PHP workers, plaintext :8080). Run from THIS directory: ./rr serve -c .rr.yaml
version: '3'

server:
  command: "php worker.php"
  relay: pipes

http:
  address: 0.0.0.0:8080
  pool:
    num_workers: 32

logs:
  level: error
  mode: production
