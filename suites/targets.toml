app = "static"
mode = "worker"
proto = "http1"
binary = "pr"
start = ["worker", "@RIG@/apps/hello/worker.php", "@RIG@/servers/rapira/static.toml.tpl"]
url = "/?name=you"
expect = "apps/hello/expect.txt"
config = "servers/rapira/static.toml.tpl"

[static-rapira-plain]
server = "rapira"
app = "static"
mode = "worker"
