# The per-merge suite. CI runs it against the nightly asset after every merge to the rapira main branch.
# The gRPC targets join when gRPC is in rapira main; the nightly asset has no gRPC support.
name = "ci"
rounds = 1
stage_s = 20
connections = 256
smoke = false
targets = [
  "hello-rapira-worker",
  "hello-rapira-dispatcher",
  "hello-rapira-classic",
  "hello-frankenphp-worker",
  "hello-php-fpm",
  "symfony-rapira-worker",
  "symfony-rapira-classic",
  "symfony-frankenphp-worker",
  "symfony-frankenphp-classic",
  "symfony-php-fpm",
  "laravel-rapira-worker",
  "laravel-frankenphp-worker",
  "static-rapira-hit",
  "static-frankenphp-hit",
]

[floors]
hello = 10000
symfony = 10000
laravel = 5000
static = 10000
